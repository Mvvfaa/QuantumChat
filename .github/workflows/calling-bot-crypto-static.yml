name: Calling Bot Crypto Static Guards

# Anti-regression checks for the calling-bot signaling relay — it must stay a
# blind relay of X5 sealed envelopes and never accept/forward raw SDP/ICE.
on:
  push:
    paths:
      - 'calling-bot/**'
      - '.github/workflows/calling-bot-crypto-static.yml'
  pull_request:
    paths:
      - 'calling-bot/**'
      - '.github/workflows/calling-bot-crypto-static.yml'

permissions:
  contents: read

jobs:
  crypto-static:
    name: Crypto Static Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Forbid plaintext WebRTC signaling relays
        run: |
          set -euo pipefail
          if grep -RInE --include='*.js' \
            "emit\(eventName.*\b(sdp|candidate)\b" \
            calling-bot/src; then
            echo "::error::Raw SDP/ICE fields must not appear on call:*/meeting:* relays — use X5 envelopes."
            exit 1
          fi
          echo "OK: no plaintext call/meeting signaling relay detected"

      - name: Require sealed envelope guard usage
        run: |
          set -euo pipefail
          test -f calling-bot/src/callEnvelope.js
          grep -q "isSealedEnvelope" calling-bot/src/callEnvelope.js
          grep -q "hasForbiddenPlaintextSignaling" calling-bot/src/callEnvelope.js
          test -f calling-bot/src/relay.js
          grep -q "isSealedEnvelope" calling-bot/src/relay.js
          grep -q "payload.sdp != null || payload.candidate != null" calling-bot/src/relay.js
          echo "OK: calling-bot enforces sealed envelopes before relaying"

      - name: Forbid database dependency (bot must stay database-free)
        run: |
          set -euo pipefail
          if grep -RInE "mongoose|mongodb" calling-bot/package.json; then
            echo "::error::calling-bot must stay database-free — no Mongo dependency."
            exit 1
          fi
          echo "OK: calling-bot has no database dependency"
